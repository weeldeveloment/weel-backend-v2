# Alertmanager hech qayerga xabar YUBORMAYDI (Telegram 2026-11-09 da o'chirildi).
# Alertlar faqat Grafana -> Alerting va Alertmanager UI'da ko'rinadi.
global:
  resolve_timeout: 5m

route:
  receiver: none
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  # Backend butunlay yotgan bo'lsa — uning 5xx/latency/trafik simptomlari jim.
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [service="weel-backend"]
  - source_matchers: [alertname="BackendDown"]
    target_matchers: [alertname=~"CeleryNoWorkers|CeleryQueueBacklog|BackendLogErrorSpike|BackendNoLogs"]
  # Postgres/Redis yotgan bo'lsa — backend/celery/log alertlari sabab emas, oqibat.
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [service=~"weel-backend|celery|logs"]
  - source_matchers: [alertname="RedisDown"]
    target_matchers: [service=~"weel-backend|celery|logs"]
  # Tashqi endpoint yotgan bo'lsa "sekin" degan ogohlantirish kerak emas.
  - source_matchers: [alertname="EndpointDown"]
    target_matchers: [alertname="EndpointSlow"]
    equal: [instance]
  # Host RAM to'lgan bo'lsa konteyner OOM alertlari takror.
  - source_matchers: [alertname="HostHighMemory"]
    target_matchers: [alertname="ContainerHighMemory"]
  # Disk 24 soatda to'ladi (critical) — 85% ogohlantirishi ortiqcha.
  - source_matchers: [alertname="HostDiskWillFillIn24h"]
    target_matchers: [alertname="HostDiskFillingUp"]
    equal: [mountpoint]

receivers:
  - name: none
