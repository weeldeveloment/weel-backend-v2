# Weel monitoring stack — Dokploy'da ALOHIDA "Compose" ilova sifatida deploy qilinadi.
#
#   Grafana · Prometheus · Loki · Tempo · Alertmanager · Alloy (log shipper)
#   + exporterlar (node, cadvisor, postgres, redis, blackbox, celery)
#   + alert-relay (Alertmanager -> Claude Routine)  + mcp-grafana (Claude uchun MCP)
#
# Tarmoq: backend konteynerlari bilan BITTA Docker tarmog'ida (dokploy-network)
# bo'lishi shart — shunda `weel-backend:8000`, Postgres va Redis nomlari hal bo'ladi,
# backend esa `tempo:4318` ni ko'radi.
#
# Dokploy'da: Compose Type = "Docker Compose" (Stack EMAS — cadvisor/node-exporter
# uchun privileged/pid:host kerak, swarm stack buni qo'llamaydi).
#
# Tashqariga faqat Grafana (GRAFANA_DOMAIN) va MCP (MCP_DOMAIN) Traefik orqali chiqadi.
# Hech bir exporter host portiga bog'lanmaydi.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks: [monitoring, shared]

services:
  # ──────────────────────────── Grafana ────────────────────────────
  grafana:
    <<: *common
    image: grafana/grafana:12.4.10
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/00-platform-overview.json
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceToMetrics
      # Grafana o'z holatini (foydalanuvchilar, API tokenlar, UI'da qilingan
      # o'zgarishlar) qayerda saqlaydi. Default: sqlite grafana-data volume'da
      # (hech qanday tayyorgarlik kerak emas). Postgres xohlasangiz .env'da
      # GRAFANA_DB_TYPE=postgres qiling va DB_* ni to'ldiring (avval
      # `CREATE DATABASE grafana` qilib qo'yish kerak).
      GF_DATABASE_TYPE: ${GRAFANA_DB_TYPE:-sqlite3}
      GF_DATABASE_HOST: ${DB_HOST:-postgres}:${DB_PORT:-5432}
      GF_DATABASE_NAME: ${GRAFANA_DB_NAME:-grafana}
      GF_DATABASE_USER: ${DB_USER:-}
      GF_DATABASE_PASSWORD: ${DB_PASSWORD:-}
      GF_DATABASE_SSL_MODE: ${DB_SSL_MODE:-disable}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki, prometheus, tempo, alertmanager]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}
      - traefik.http.routers.weel-grafana.rule=Host(`${GRAFANA_DOMAIN}`)
      - traefik.http.routers.weel-grafana.entrypoints=websecure
      - traefik.http.routers.weel-grafana.tls.certresolver=letsencrypt
      - traefik.http.services.weel-grafana.loadbalancer.server.port=3000
      # HTTP -> HTTPS
      - traefik.http.routers.weel-grafana-http.rule=Host(`${GRAFANA_DOMAIN}`)
      - traefik.http.routers.weel-grafana-http.entrypoints=web
      - traefik.http.routers.weel-grafana-http.middlewares=weel-grafana-https@docker
      - traefik.http.middlewares.weel-grafana-https.redirectscheme.scheme=https
      - traefik.http.middlewares.weel-grafana-https.redirectscheme.permanent=true

  # ─────────────────────────── Prometheus ──────────────────────────
  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.5
    user: root   # entrypoint prometheus.yml ni volume ichiga render qiladi
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - --config.file=/prometheus/prometheus.rendered.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-8GB}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver   # Tempo metrics-generator (span metrics, service graph)
      - --enable-feature=exemplar-storage
      # external-url faqat alert xabaridagi havola uchun; route-prefix=/ bo'lmasa
      # Prometheus o'z API'sini /prometheus/ ostiga ko'chirib qo'yadi.
      - --web.external-url=https://${GRAFANA_DOMAIN}/prometheus
      - --web.route-prefix=/
    environment:
      BACKEND_TARGET: ${BACKEND_TARGET}
      PROMETHEUS_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN}
    volumes:
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.template.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./blackbox/targets.yml:/etc/prometheus/blackbox-targets.yml:ro
      - prometheus-data:/prometheus
    depends_on: [alertmanager]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ───────────────────────────── Loki ──────────────────────────────
  loki:
    <<: *common
    image: grafana/loki:3.6.16
    command: -config.file=/etc/loki/loki.yml -target=all
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/loki/rules:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─────────── Alloy — barcha konteyner loglarini Loki'ga ───────────
  # (Promtail 2026-03 dan EOL; Alloy uning o'rnini bosuvchi rasmiy agent.)
  alloy:
    <<: *common
    image: grafana/alloy:v1.19.2
    user: root   # docker.sock va /var/lib/docker/containers uchun
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    environment:
      # Backend konteynerini nomidan tanish uchun regex (Dokploy app nomi).
      BACKEND_CONTAINER_REGEX: ${BACKEND_CONTAINER_REGEX:-.*weel[-_]?backend.*}
      B2B_CONTAINER_REGEX: ${B2B_CONTAINER_REGEX:-.*weel[-_]?b2b.*}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

  # ───────────────────────────── Tempo ─────────────────────────────
  tempo:
    <<: *common
    image: grafana/tempo:2.10.8
    user: root   # /var/tempo volume egaligi
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    # OTLP: 4318 (HTTP) / 4317 (gRPC) — faqat ichki tarmoq. Backend env:
    #   OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    depends_on: [prometheus]

  # ─────────────────────────── Alertmanager ────────────────────────
  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.28.1
    user: root
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - --config.file=/alertmanager/alertmanager.rendered.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${GRAFANA_DOMAIN}/alertmanager
      - --web.route-prefix=/
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
    volumes:
      - ./alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ────── alert-relay: Alertmanager webhook -> Claude Routine /fire ──────
  alert-relay:
    <<: *common
    image: python:3.12-alpine
    command: ["python", "-u", "/app/relay.py"]
    environment:
      ROUTINE_FIRE_URL: ${ROUTINE_FIRE_URL:-}
      ROUTINE_FIRE_TOKEN: ${ROUTINE_FIRE_TOKEN:-}
      ROUTINE_BETA_HEADER: ${ROUTINE_BETA_HEADER:-}
      RELAY_MIN_INTERVAL_SECONDS: ${RELAY_MIN_INTERVAL_SECONDS:-900}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
    volumes:
      - ./alert-relay/relay.py:/app/relay.py:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────── Exporterlar ─────────────────────────
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$$
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project,com.docker.swarm.service.name
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  postgres-exporter:
    <<: *common
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: ${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:-disable}
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: template0,template1

  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.90.0
    environment:
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Celery broker navbati = Redis list. `celery` — default navbat nomi.
      # Natija: redis_key_size{key="celery"} = navbatdagi ishlar soni.
      REDIS_EXPORTER_CHECK_KEYS: ${REDIS_EXPORTER_CHECK_KEYS:-celery}
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "true"

  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  celery-exporter:
    <<: *common
    image: danihodovic/celery-exporter:0.12.2
    command:
      - --broker-url=${CELERY_BROKER_URL}
      - --retry-interval=5
      - --port=9808
    # Task eventlarni Redis brokerdan o'qiydi. Backend core/celery.py da
    # worker_send_task_events=True + task_send_sent_event=True yoqilgan.

  # ───────────── mcp-grafana: Claude uchun faqat-o'qish MCP ─────────────
  mcp-grafana:
    <<: *common
    image: mcp/grafana:latest@sha256:9362bcf6aa0e44e61f645b905cec03fb346a946a34a4dafecd7f3e28d3724014
    command:
      - -t=streamable-http
      - -address=0.0.0.0:8000
      - -allowed-hosts=${MCP_DOMAIN}
      # URL'ning o'zi sir: https://MCP_DOMAIN/<MCP_PATH_SECRET>/mcp
      # (claude.ai custom connector va Claude Code header'siz ulanadi).
      - -endpoint-path=/${MCP_PATH_SECRET}/mcp
      - -disable-write
      - -enabled-tools=search,datasource,prometheus,loki,alerting,dashboard,folder,navigation,annotations,runpanelquery
      - -log-level=info
      - -max-loki-log-limit=200
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SA_TOKEN}
    depends_on: [grafana]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}
      - traefik.http.routers.weel-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.weel-mcp.entrypoints=websecure
      - traefik.http.routers.weel-mcp.tls.certresolver=letsencrypt
      - traefik.http.routers.weel-mcp.middlewares=weel-mcp-ratelimit@docker
      - traefik.http.middlewares.weel-mcp-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.weel-mcp-ratelimit.ratelimit.burst=40
      - traefik.http.services.weel-mcp.loadbalancer.server.port=8000

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alertmanager-data:
  alloy-data:

networks:
  # Stack'ning o'z tarmog'i — exporterlar shu yerda.
  monitoring:
  # Backend, Postgres va Redis turgan Dokploy tarmog'i (mavjud bo'lishi shart).
  shared:
    name: ${DOKPLOY_NETWORK:-dokploy-network}
    external: true
