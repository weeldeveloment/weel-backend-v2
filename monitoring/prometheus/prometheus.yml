# SHABLON: __BACKEND_TARGET__ va __PROMETHEUS_METRICS_TOKEN__ ni entrypoint.sh
# env'dan qo'yadi (Prometheus o'zi ${ENV} ni kengaytirmaydi).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: weel
    env: production

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # ── monitoring stack o'zini kuzatish ──
  - job_name: prometheus
    static_configs: [{ targets: [localhost:9090] }]
  - job_name: grafana
    static_configs: [{ targets: [grafana:3000] }]
  - job_name: loki
    static_configs: [{ targets: [loki:3100] }]
  - job_name: alloy
    static_configs: [{ targets: [alloy:12345] }]
  - job_name: tempo
    static_configs: [{ targets: [tempo:3200] }]
  - job_name: alertmanager
    static_configs: [{ targets: [alertmanager:9093] }]
  - job_name: alert-relay
    static_configs: [{ targets: [alert-relay:8080] }]
  - job_name: ops-agent
    metrics_path: /ops/metrics
    static_configs: [{ targets: [ops-agent:8090] }]

  # ── infra exporterlar ──
  - job_name: node-exporter
    static_configs: [{ targets: [node-exporter:9100] }]
  - job_name: cadvisor
    static_configs: [{ targets: [cadvisor:8080] }]
    metric_relabel_configs:
      # Konteyner nomini soddalashtirish: swarm "app-x1y2.1.abcdef" -> "app-x1y2"
      - source_labels: [name]
        regex: '([^.]+)\.\d+\.[a-z0-9]+'
        target_label: name
        replacement: '$1'
      # Docker-only bo'lsa ham keladigan bo'sh/id=/ qatorlarni tashlab yuborish.
      - source_labels: [__name__, name]
        regex: 'container_.*;'
        action: drop
  - job_name: postgres-exporter
    static_configs: [{ targets: [postgres-exporter:9187] }]
  - job_name: redis-exporter
    static_configs: [{ targets: [redis-exporter:9121] }]
  - job_name: celery-exporter
    static_configs: [{ targets: [celery-exporter:9808] }]

  # ── Weel backend (django-prometheus) ──
  # Ichki tarmoq orqali. core/middleware/metrics_guard.py tashqi IP'larga
  # tokensiz 404 beradi; token shu yerdan ketadi.
  - job_name: weel-backend
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: "__PROMETHEUS_METRICS_TOKEN__"
    static_configs:
      - targets: ["__BACKEND_TARGET__"]
        labels: { service: weel-backend }

  # ── blackbox: tashqi HTTP probalar (targets ro'yxati blackbox/targets.yml) ──
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/blackbox-targets.yml]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
