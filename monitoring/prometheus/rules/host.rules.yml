groups:
  - name: weel-host
    rules:
      - alert: HostHighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels: { severity: warning, service: host }
        annotations:
          summary: "Host CPU {{ $value | printf \"%.0f\" }}% (10 daqiqa)"
          description: "Containers dashboardida qaysi konteyner yeyayotganini ko'ring."
          dashboard: weel-host

      - alert: HostHighLoad
        expr: node_load5 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 15m
        labels: { severity: warning, service: host }
        annotations:
          summary: "Load average (5m) yadro soniga nisbatan {{ $value | printf \"%.1f\" }}x"
          description: "IO kutish yoki CPU to'yingan."
          dashboard: weel-host

      - alert: HostHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels: { severity: warning, service: host }
        annotations:
          summary: "Host RAM {{ $value | printf \"%.0f\" }}% band (10 daqiqa)"
          description: "OOM kill xavfi. Containers dashboardida xotira bo'yicha saralang."
          dashboard: weel-host

      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        for: 1m
        labels: { severity: critical, service: host }
        annotations:
          summary: "Kernel OOM killer ishladi ({{ $value | printf \"%.0f\" }} marta, 10 daqiqa)"
          description: "Qaysi jarayon o'ldirilganini konteyner restartlari va dmesg'dan aniqlang."
          dashboard: weel-host

      - alert: HostDiskFillingUp
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                     / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 10m
        labels: { severity: warning, service: host }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} {{ $value | printf \"%.0f\" }}% to'ldi"
          description: "Docker image/layer, Postgres, logs/, Loki/Tempo/Prometheus volume'lari — README 'Disk' bo'limi."
          dashboard: weel-host

      - alert: HostDiskCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                     / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 95
        for: 5m
        labels: { severity: critical, service: host }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} {{ $value | printf \"%.0f\" }}% — hozir tozalash kerak"
          description: "Postgres yoza olmay qoladi, konteynerlar yiqiladi."
          dashboard: weel-host

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24*3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.3
        for: 30m
        labels: { severity: critical, service: host }
        annotations:
          summary: "{{ $labels.mountpoint }} hozirgi sur'atda 24 soatda to'lib qoladi"
          description: "Trend bashorati — bu eng foydali erta ogohlantirish."
          dashboard: weel-host

      - alert: HostInodesLow
        expr: node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files < 0.1
        for: 10m
        labels: { severity: warning, service: host }
        annotations:
          summary: "{{ $labels.mountpoint }} inode'lari 10% dan kam"
          description: "Juda ko'p mayda fayl (docker overlay, cache)."
          dashboard: weel-host

      - alert: HostNetworkErrors
        expr: sum by (instance, device) (rate(node_network_transmit_errs_total{device!~"lo|veth.*|br.*|docker.*"}[5m]) + rate(node_network_receive_errs_total{device!~"lo|veth.*|br.*|docker.*"}[5m])) > 1
        for: 10m
        labels: { severity: info, service: host }
        annotations:
          summary: "Tarmoq xatolari {{ $labels.device }} da"
          description: "NIC/drayver muammosi bo'lishi mumkin."
          dashboard: weel-host

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels: { severity: warning, service: host }
        annotations:
          summary: "Host soati {{ $value | printf \"%.2f\" }}s farq qiladi"
          description: "NTP sinxron emas — TLS, JWT, Telegram initData tekshiruvlari buziladi."
          dashboard: weel-host
