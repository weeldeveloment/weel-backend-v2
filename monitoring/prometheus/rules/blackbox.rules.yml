groups:
  - name: weel-blackbox
    rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels: { severity: critical, service: uptime }
        annotations:
          summary: "{{ $labels.instance }} ({{ $labels.app }}) HTTP proba muvaffaqiyatsiz (2 daqiqa)"
          description: "HTTP status: {{ with printf \"probe_http_status_code{instance='%s'}\" $labels.instance | query }}{{ . | first | value }}{{ end }}. Tashqi foydalanuvchi ko'zi bilan sayt ochilmayapti."
          dashboard: weel-uptime

      - alert: EndpointSlow
        expr: avg_over_time(probe_duration_seconds[5m]) > 3
        for: 10m
        labels: { severity: warning, service: uptime }
        annotations:
          summary: "{{ $labels.instance }} sekin ({{ $value | humanizeDuration }} > 3s)"
          description: "Backend yuki yoki tarmoq. Backend p95 bilan solishtiring."
          dashboard: weel-uptime

      - alert: TLSCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning, service: uptime }
        annotations:
          summary: "{{ $labels.instance }} TLS sertifikati {{ $value | printf \"%.1f\" }} kunda tugaydi"
          description: "Let's Encrypt avtomatik yangilanishi ishlamayapti (Traefik acme)."
          dashboard: weel-uptime

      - alert: TLSCertExpired
        expr: probe_ssl_earliest_cert_expiry - time() <= 0
        for: 5m
        labels: { severity: critical, service: uptime }
        annotations:
          summary: "{{ $labels.instance }} TLS sertifikati muddati TUGAGAN"
          description: "Brauzerlar saytni ochmaydi."
          dashboard: weel-uptime
