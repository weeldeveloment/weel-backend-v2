modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200, 204, 301, 302, 304, 401, 403]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      headers:
        User-Agent: weel-blackbox/1.0
      tls_config:
        insecure_skip_verify: false
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
