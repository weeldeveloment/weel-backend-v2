# Tashqi HTTP probalar (file_sd — Prometheus 1 daqiqada qayta o'qiydi, restart shart emas).
# Domenlarni tekshiring/to'g'rilang. `app` label Grafana'da filtr uchun.
- labels: { app: backend, kind: api }
  targets:
    - https://dev.weel.uz/health/
- labels: { app: weel-b2b, kind: frontend }
  targets:
    # business.weel.uz Traefik'da route'siz (404) - weel-b2b frontend domen migratsiyasidan keyin
    # weel.uz ostiga ko'chgan (/files, /reports, /tasks ...). EndpointDown 2026-10-06'dan beri
    # yonib turardi (weel.uz/files - 200, b2b-web konteyner javobi bilan mos; business.weel.uz - Traefik 404).
    - https://weel.uz/files
- labels: { app: weel-admin, kind: frontend }
  targets:
    - https://admin.weel.uz/
- labels: { app: weel.uz, kind: frontend }
  targets:
    - https://partners.weel.uz/
- labels: { app: dashboard_weel_uz, kind: frontend }
  targets:
    - https://weel.uz/
- labels: { app: grafana, kind: monitoring }
  targets:
    - https://grafana.weel.uz/api/health
