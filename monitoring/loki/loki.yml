# Loki 3.x, single-binary, filesystem storage. Loglar 30 kun saqlanadi.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules-shared

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  volume_enabled: true                   # Explore -> log volume
  retention_period: 720h                 # 30 kun
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_query_series: 5000
  max_query_parallelism: 8
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_label_names_per_series: 20
  discover_log_levels: true              # `detected_level` avtomatik
  query_timeout: 2m

pattern_ingester:
  enabled: true                           # Explore Logs "patterns"

querier:
  max_concurrent: 8

query_range:
  align_queries_with_step: true
  cache_results: true

frontend:
  encoding: protobuf
  max_outstanding_per_tenant: 2048

ruler:
  # Log asosidagi alertlar (loki/rules/fake/*.yml) -> Alertmanager.
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
