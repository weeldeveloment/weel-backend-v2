apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.5.0
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
      alertmanagerUid: alertmanager

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      alertmanagerUid: alertmanager
      # Log qatoridagi trace_id -> Tempo'da trace ochish
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: "Trace"
        - name: trace_id_in_message
          matcherType: regex
          matcherRegex: '"trace_id"\s*:\s*"(\w{16,32})"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: "Trace"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      streamingEnabled:
        search: true
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      # span -> shu trace_id bo'yicha Loki loglari
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="weel-backend"} | trace_id="$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        queries:
          - name: "Span rate"
            query: 'sum(rate(traces_spanmetrics_calls_total{span_name="$${__span.name}"}[5m]))'
          - name: "Span p95"
            query: 'histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{span_name="$${__span.name}"}[5m])) by (le))'

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
