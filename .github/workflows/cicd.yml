name: CI/CD to Dokploy (zero downtime)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/weel-backend-v2

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name (lowercase for GHCR)
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}   # optional preferred
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - name: Trigger Dokploy deploy (webhook)
        if: env.DOKPLOY_WEBHOOK != ''
        run: curl -fsS -X POST "$DOKPLOY_WEBHOOK"

      - name: Trigger Dokploy deploy (API)
        if: env.DOKPLOY_WEBHOOK == '' && env.DOKPLOY_URL != '' && env.DOKPLOY_APP_ID != '' && env.DOKPLOY_API_KEY != ''
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\"}"

      - name: Skip deploy (no Dokploy secrets)
        if: env.DOKPLOY_WEBHOOK == '' && (env.DOKPLOY_URL == '' || env.DOKPLOY_APP_ID == '' || env.DOKPLOY_API_KEY == '')
        run: echo "Deploy skipped: no Dokploy webhook or API secrets configured."
