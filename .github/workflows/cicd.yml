name: CI/CD to Dokploy (zero downtime)

on:
  push:
    branches: [main]
  # PR'da ham ishlaydi, lekin faqat tekshiruv qismi: build/deploy joblari
  # `if: github.event_name != 'pull_request'` bilan cheklangan.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/weel-backend-v2

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.1.0

      - name: Install dependencies
        run: poetry install --no-root --no-ansi

      # Uses core.test_settings (sqlite, in-memory) — see pytest.ini. The
      # integration tests that need a live PostgreSQL schema skip themselves
      # unless WEEL_INTEGRATION_DB=1.
      - name: Run tests
        # core.test_settings imports core.settings, which refuses to start
        # without a secret key and allowed hosts unless DEBUG is on. There is
        # no .env on a runner, so the settings have to come from here.
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS: example.com
          REDIS_CONNECTION_STRING: redis://localhost:6379/0
        run: poetry run pytest -q

      - name: Django deployment checks
        env:
          DJANGO_DEBUG: '0'
          SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS: example.com
          REDIS_CONNECTION_STRING: redis://localhost:6379/0
        run: poetry run python manage.py check --deploy --fail-level ERROR

  # Backend o'zgarishi frontendlarni buzmasligini tekshiradi. Ikki bosqich:
  #   1. Kontrakt farqi — tez, baseline bilan solishtiradi (frontend repolarsiz).
  #   2. Har bir frontendda tiplarni backenddan qayta generatsiya qilib typecheck.
  # 2-bosqich uchun org repolarini o'qiy oladigan token kerak: FRONTEND_REPOS_TOKEN
  # secret'i yo'q bo'lsa, bu bosqich o'tkazib yuboriladi (1-bosqich baribir ishlaydi).
  frontend-contract:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: example.com
      REDIS_CONNECTION_STRING: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          path: weel-backend-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.1.0

      - name: Install backend dependencies
        working-directory: weel-backend-v2
        run: poetry install --no-root --no-ansi

      # Generatsiya skriptlari `${PYTHON:-venv/bin/python}` ishlatadi; CI'da venv
      # yo'q, shuning uchun poetry muhitidagi python'ni ko'rsatamiz.
      - name: Resolve Python path
        working-directory: weel-backend-v2
        run: echo "PYTHON=$(poetry env info --path)/bin/python" >> $GITHUB_ENV

      - name: API kontrakti — buzuvchi o'zgarishlar
        working-directory: weel-backend-v2
        run: poetry run python tools/api_contract_check.py

      - name: Check for frontend repo token
        id: token
        run: |
          if [ -n "${{ secrets.FRONTEND_REPOS_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::FRONTEND_REPOS_TOKEN yo'q — frontend typecheck o'tkazib yuborildi."
          fi

      # actions/checkout huquq yetmasa shunchaki "Not Found" deydi va sababini
      # aytmaydi. Bu qadam har bir repoga alohida urinib, aniq xabar beradi.
      - name: Tokenning frontend repolarga huquqini tekshirish
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPOS_TOKEN }}
        run: |
          missing=""
          for repo in dashboard_weel_uz weel-admin weel-b2b; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/weeldeveloment/$repo")
            if [ "$code" = "200" ]; then
              echo "✅ $repo — o'qish mumkin"
            else
              echo "❌ $repo — HTTP $code"
              missing="$missing $repo"
            fi
          done

          if [ -n "$missing" ]; then
            cat <<EOF
          ::error::FRONTEND_REPOS_TOKEN bu repolarni ko'ra olmayapti:$missing

          Eng ko'p uchraydigan uchta sabab:
            1. Fine-grained token tashkilot tasdig'ini kutmoqda.
               Org Settings -> Third-party Access -> Personal access tokens
               -> Pending requests dan tasdiqlang.
            2. Token yaratilganda "Resource owner" sifatida shaxsiy hisob
               tanlangan. U 'weeldeveloment' bo'lishi kerak.
            3. "Repository access" da bu repolar belgilanmagan, yoki
               "Contents: Read-only" huquqi berilmagan.
          EOF
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.available == 'true'
        with:
          repository: weeldeveloment/dashboard_weel_uz
          token: ${{ secrets.FRONTEND_REPOS_TOKEN }}
          path: dashboard_weel_uz

      - uses: actions/checkout@v4
        if: steps.token.outputs.available == 'true'
        with:
          repository: weeldeveloment/weel-admin
          token: ${{ secrets.FRONTEND_REPOS_TOKEN }}
          path: weel-admin

      - uses: actions/checkout@v4
        if: steps.token.outputs.available == 'true'
        with:
          repository: weeldeveloment/weel-b2b
          token: ${{ secrets.FRONTEND_REPOS_TOKEN }}
          path: weel-b2b

      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.available == 'true'

      # Har biri alohida qadam: qaysi frontend yiqilgani bir qarashda ko'rinsin.
      # `continue-on-error` yo'q — birinchi yiqilgani deploy'ni to'xtatadi.
      - name: dashboard_weel_uz — tiplarni qayta generatsiya + typecheck
        if: steps.token.outputs.available == 'true'
        working-directory: dashboard_weel_uz
        run: bun install --frozen-lockfile && bun run gen:spec && bun run typecheck

      - name: weel-admin — tiplarni qayta generatsiya + typecheck
        if: steps.token.outputs.available == 'true'
        working-directory: weel-admin
        run: bun install --frozen-lockfile && bun run generate:openapi-types && bunx tsc --noEmit

      - name: weel-b2b — tiplarni qayta generatsiya + typecheck
        if: steps.token.outputs.available == 'true'
        working-directory: weel-b2b
        run: bun install --frozen-lockfile && bun run gen:api && bunx tsc -b --noEmit

  build-and-push:
    needs: [test, frontend-contract]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name (lowercase for GHCR)
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}   # optional preferred
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - name: Trigger Dokploy deploy (webhook)
        if: env.DOKPLOY_WEBHOOK != ''
        run: curl -fsS -X POST "$DOKPLOY_WEBHOOK"

      - name: Trigger Dokploy deploy (API)
        if: env.DOKPLOY_WEBHOOK == '' && env.DOKPLOY_URL != '' && env.DOKPLOY_APP_ID != '' && env.DOKPLOY_API_KEY != ''
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\"}"

      - name: Skip deploy (no Dokploy secrets)
        if: env.DOKPLOY_WEBHOOK == '' && (env.DOKPLOY_URL == '' || env.DOKPLOY_APP_ID == '' || env.DOKPLOY_API_KEY == '')
        run: |
          echo "Deploy skipped: no Dokploy webhook or API secrets configured."
