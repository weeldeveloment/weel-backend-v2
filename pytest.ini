; `[pytest]`, not `[tool:pytest]`: the latter is the section name pytest reads
; out of setup.cfg. In a pytest.ini it matches nothing, so every setting below
; — the settings module, the collected file patterns, the markers — was being
; silently ignored, and `tests.py` files were never collected at all.
[pytest]
# core.test_settings, never core.settings: the default settings module reads
# .env and connects to whatever real database it points at. Tests create and
# delete rows, so pointing them at a live database is how you lose production
# bookings.
DJANGO_SETTINGS_MODULE = core.test_settings
python_files = tests.py test_*.py *_tests.py
addopts = --tb=short -v
markers =
    integration: needs a live PostgreSQL database with the raw-SQL schema (opt in with WEEL_INTEGRATION_DB=1)
    smoke: walks every route against a database carrying the complete raw schema (opt in with WEEL_SMOKE_DB=1)
