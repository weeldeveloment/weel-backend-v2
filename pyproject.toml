[tool.poetry]
name = "weel-backend"
version = "0.1.0"
description = "Weel Backend API"
authors = ["xelland042 <xelland042@gmail.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"
psycopg2-binary = "^2.9.10"
django = "^5.2.6"
djangorestframework = "^3.16.1"
djangorestframework-simplejwt = "^5.5.1"
pillow = "^12.0.0"
pillow-heif = "^0.22.0"
phonenumbers = "^9.0.14"
requests = "^2.32.5"
drf-yasg = "^1.21.10"
python-dotenv = "^1.1.1"
django-cors-headers = "^4.9.0"
django-filter = "^25.1"
celery = "^5.5.3"
django-redis = "^6.0.0"
pyjwt = "^2.10.1"
django-celery-beat = "^2.8.1"
django-import-export = "^4.3.10"
django-unfold = "^0.66.0"
channels = "^4.3.2"
daphne = "^4.2.1"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
channels-redis = "^4.2.0"
gunicorn = "^23.0.0"
whitenoise = "^6.11.0"
pytest = "^9.0.1"
pytest-django = "^4.11.1"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
init-data-py = "^0.2.7"
firebase-admin = "^7.1.0"
flower = "^2.0.1"
django-prometheus = "^2.4.1"
python-json-logger = "^4.0.0"
django-request-logging = "^0.7.5"
django-minio-storage = "^0.5.7"
django-storages = "^1.14.0"
boto3 = "^1.35.0"
python-telegram-bot = "^21.10"
openpyxl = "^3.1.5"
numpy = "^2.2.0"
pytesseract = "^0.3.13"
pydantic = "^2.12.5"
qrcode = "^8.2"
opentelemetry-api = "^1.43.0"
opentelemetry-sdk = "^1.43.0"
opentelemetry-instrumentation-django = "^0.64b0"
opentelemetry-instrumentation-celery = "^0.64b0"
opentelemetry-instrumentation-redis = "^0.64b0"
opentelemetry-instrumentation-psycopg2 = "^0.64b0"
opentelemetry-exporter-otlp-proto-http = "^1.43.0"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
django-stubs = "^6.0.3"
djangorestframework-stubs = "^3.16.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.dokploy]
start = "poetry run uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --ws websockets"
